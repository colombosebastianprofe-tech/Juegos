<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Remoto - Raspberry Pi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0d1117;
            --bg-card: #161b22;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
            --accent-blue: #58a6ff;
            --accent-red: #da3633;
            --status-online: #3fb950;
            --status-offline: #f85149;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-title h1 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            background-color: rgba(63, 185, 80, 0.15);
            color: var(--status-online);
            border: 1px solid rgba(63, 185, 80, 0.3);
            font-family: 'JetBrains Mono', monospace;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--status-online);
            box-shadow: 0 0 8px var(--status-online);
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        main {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .toolbar {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .url-input-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            min-width: 280px;
        }

        .url-input-container label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        input[type="text"] {
            width: 100%;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 0.9rem;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #21262d;
            color: var(--text-primary);
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: #30363d;
            border-color: var(--text-secondary);
        }

        button.btn-primary {
            background-color: var(--accent-green);
            border-color: rgba(240, 246, 252, 0.1);
            color: #ffffff;
        }

        button.btn-primary:hover {
            background-color: var(--accent-green-hover);
        }

        .viewport-container {
            flex: 1;
            min-height: 600px;
            background-color: #000000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 600px;
            border: none;
            display: block;
        }

        .placeholder-screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            color: var(--text-secondary);
            text-align: center;
            padding: 2rem;
        }

        .placeholder-screen svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-secondary);
            opacity: 0.5;
        }

        footer {
            padding: 1rem 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-card);
        }

        footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <h1>Raspberry Pi - Remote Console</h1>
            <span class="status-badge" id="statusBadge">
                <span class="status-dot"></span>
                <span id="statusText">Listo</span>
            </span>
        </div>
        <div class="header-info">
            <div class="info-item">
                <span>IP Local:</span>
                <strong style="color: var(--text-primary);">10.160.31.175</strong>
            </div>
            <div class="info-item">
                <span>Motor:</span>
                <strong style="color: var(--text-primary);">noVNC + Cloudflare</strong>
            </div>
        </div>
    </header>

    <main>
        <div class="toolbar">
            <div class="url-input-container">
                <label for="tunnelUrl">URL del Túnel:</label>
                <input type="text" id="tunnelUrl" placeholder="https://tu-tunel.trycloudflare.com/vnc.html" value="">
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="connectVNC()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Conectar
                </button>
                <button onclick="reloadFrame()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    Recargar
                </button>
                <button onclick="toggleFullscreen()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                    Pantalla Completa
                </button>
            </div>
        </div>

        <div class="viewport-container" id="viewportContainer">
            <div class="placeholder-screen" id="placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <p>Ingresá la URL del túnel de noVNC y presioná <strong>Conectar</strong> para iniciar la transmisión del escritorio.</p>
            </div>
            <iframe id="vncFrame" src="" allowfullscreen style="display: none;"></iframe>
        </div>
    </main>

    <footer>
        <p>Alojado en GitHub Pages | Conexión WebSocket cifrada vía Cloudflare Tunnel</p>
    </footer>

    <script>
        // Cargar la URL guardada previamente en localStorage si existe
        document.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('vnc_tunnel_url');
            if (savedUrl) {
                document.getElementById('tunnelUrl').value = savedUrl;
            }
        });

        function connectVNC() {
            const urlInput = document.getElementById('tunnelUrl').value.trim();
            const frame = document.getElementById('vncFrame');
            const placeholder = document.getElementById('placeholder');
            const statusText = document.getElementById('statusText');

            if (!urlInput) {
                alert('Por favor ingresá una URL válida de noVNC / Cloudflare.');
                return;
            }

            // Guardar en localStorage para futuras sesiones
            localStorage.setItem('vnc_tunnel_url', urlInput);

            // Ajustar parámetros recomendados para noVNC si no están presentes
            let targetUrl = urlInput;
            if (!targetUrl.includes('autoconnect=')) {
                targetUrl += (targetUrl.includes('?') ? '&' : '?') + 'autoconnect=true&resize=remote';
            }

            placeholder.style.display = 'none';
            frame.style.display = 'block';
            frame.src = targetUrl;

            statusText.innerText = 'Conectando...';
        }

        function reloadFrame() {
            const frame = document.getElementById('vncFrame');
            if (frame.src && frame.src !== 'about:blank') {
                frame.src = frame.src;
            }
        }

        function toggleFullscreen() {
            const container = document.getElementById('viewportContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
